# CI for boqlet (plan/08-delivery/testing.md "CI pipeline").
# Until FE-046 every product job runs in the product root boqlet_v1/ (P44).
name: ci

on:
  push:
    branches: [v_1, main]
  pull_request:
    branches: [v_1, main]

defaults:
  run:
    working-directory: boqlet_v1

jobs:
  contract:
    name: Contract (lint, codegen drift)
    runs-on: ubuntu-latest
    env:
      IFC_BOQ_SKIP_ENGINE_SETUP: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: boqlet_v1/package-lock.json
      - run: npm ci
      - run: npm run api:lint
      - name: Generated API clients match the OpenAPI files
        run: npm run api:check
      - name: Engine JSON Schemas match the TypeScript types
        run: npm run codegen && git diff --exit-code -- packages/types/schema

  typecheck:
    name: Typecheck and build
    runs-on: ubuntu-latest
    env:
      IFC_BOQ_SKIP_ENGINE_SETUP: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: boqlet_v1/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:app
      - name: Mock API tests (the engine-backed Duplex test runs in the engine job)
        run: npm run test:mock
      - run: npm run build:app

  e2e:
    name: App end-to-end (Playwright)
    runs-on: ubuntu-latest
    env:
      IFC_BOQ_SKIP_ENGINE_SETUP: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: boqlet_v1/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: boqlet_v1/apps/app
      - run: npm run e2e:app
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: boqlet_v1/apps/app/playwright-report

  engine:
    name: Engine tests (incl. Duplex acceptance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: boqlet_v1/package-lock.json
      - run: npm ci
        env:
          IFC_BOQ_PYTHON: python
      - run: npm run test:engine
      - name: The mock runs the Duplex through the PoC engine (M0)
        run: |
          npm run dev:engine > engine.log 2>&1 &
          for i in $(seq 1 90); do curl -sf http://127.0.0.1:8787/api/health && break; sleep 2; done
          npm run test:mock

  suites:
    name: Contract and scenario suites (against the mock)
    runs-on: ubuntu-latest
    env:
      IFC_BOQ_SKIP_ENGINE_SETUP: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: boqlet_v1/package-lock.json
      - run: npm ci
      - run: npm run test:contract:mock
      - run: npm run test:scenarios:mock
