openapi: 3.1.0
info:
  title: IFC BoQ platform API
  version: 1.0.0-draft
  description: |
    The HTTP contract between the Next.js app and the backend (mock API first, Java later).
    Conventions (auth, errors, pagination, idempotency, SSE) are in `plan/05-api/conventions.md`.
    Engine shapes are referenced from `packages/types/schema/*.schema.json` (generated from
    `packages/types/src`), never redefined here.
servers:
  - url: /api/v1
security:
  - bearer: []
tags:
  - name: me
  - name: orgs
  - name: billing
  - name: projects
  - name: models
  - name: library
  - name: decisions
  - name: boqs
  - name: adjustments
  - name: runs
  - name: diffs
  - name: exports
  - name: jobs
  - name: notifications
  - name: events
  - name: sessions
  - name: sharing
  - name: public
  - name: admin

paths:
  # ───────────────────────────── me ─────────────────────────────
  /me:
    get:
      tags: [me]
      operationId: getMe
      summary: Current user, memberships, session and module extensions
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Me" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    patch:
      tags: [me]
      operationId: updateMe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                locale: { type: string }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
  /me/notification-preferences:
    get:
      tags: [me]
      operationId: getNotificationPreferences
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/NotificationPreferences" } } } }
    put:
      tags: [me]
      operationId: setNotificationPreferences
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/NotificationPreferences" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/NotificationPreferences" } } } }

  # ───────────────────────────── orgs ─────────────────────────────
  /orgs:
    get:
      tags: [orgs]
      operationId: listOrgs
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Org" } } } } }
    post:
      tags: [orgs]
      operationId: createOrg
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/OrgCreate" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Org" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
  /orgs/{orgId}:
    parameters: [{ $ref: "#/components/parameters/OrgId" }]
    get:
      tags: [orgs]
      operationId: getOrg
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Org" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [orgs]
      operationId: updateOrg
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/OrgUpdate" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Org" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [orgs]
      operationId: deleteOrg
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmName]
              properties:
                confirmName: { type: string }
      responses:
        "202": { description: Deletion scheduled }
        "403": { $ref: "#/components/responses/Forbidden" }
  /orgs/{orgId}/setup:
    parameters: [{ $ref: "#/components/parameters/OrgId" }]
    get:
      tags: [orgs]
      operationId: getOrgSetup
      description: Setup wizard progress (F16). `204` when the org never started setup.
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/OrgSetup" } } } }
        "204": { description: Setup not started }
    put:
      tags: [orgs]
      operationId: putOrgSetup
      description: Save setup wizard progress (owner, admin, library editor). The presets themselves are saved through the Library endpoints.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/OrgSetupUpdate" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/OrgSetup" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
  /orgs/{orgId}/members:
    parameters: [{ $ref: "#/components/parameters/OrgId" }]
    get:
      tags: [orgs]
      operationId: listMembers
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Membership" } } } } }
  /orgs/{orgId}/members/{userId}:
    parameters: [{ $ref: "#/components/parameters/OrgId" }, { $ref: "#/components/parameters/UserId" }]
    patch:
      tags: [orgs]
      operationId: updateMember
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { $ref: "#/components/schemas/OrgRole" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Membership" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [orgs]
      operationId: removeMember
      responses:
        "204": { description: Removed }
        "409": { $ref: "#/components/responses/Conflict" }
  /orgs/{orgId}/invitations:
    parameters: [{ $ref: "#/components/parameters/OrgId" }]
    get:
      tags: [orgs]
      operationId: listOrgInvitations
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/OrgInvitation" } } } } }
    post:
      tags: [orgs]
      operationId: inviteMember
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string, format: email }
                role: { $ref: "#/components/schemas/OrgRole" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/OrgInvitation" } } } }
        "402": { $ref: "#/components/responses/LimitReached" }
        "409": { $ref: "#/components/responses/Conflict" }
  /orgs/{orgId}/invitations/{invitationId}:
    parameters: [{ $ref: "#/components/parameters/OrgId" }, { $ref: "#/components/parameters/InvitationId" }]
    delete:
      tags: [orgs]
      operationId: revokeOrgInvitation
      responses:
        "204": { description: Revoked }
  /orgs/{orgId}/invitations/{invitationId}/resend:
    parameters: [{ $ref: "#/components/parameters/OrgId" }, { $ref: "#/components/parameters/InvitationId" }]
    post:
      tags: [orgs]
      operationId: resendOrgInvitation
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/OrgInvitation" } } } }
  /invitations/{token}:
    parameters: [{ $ref: "#/components/parameters/Token" }]
    get:
      tags: [orgs]
      operationId: previewOrgInvitation
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [orgName, email, role, status]
                properties:
                  orgName: { type: string }
                  email: { type: string }
                  role: { $ref: "#/components/schemas/OrgRole" }
                  status: { type: string, enum: [pending, accepted, revoked, expired] }
        "404": { $ref: "#/components/responses/NotFound" }
  /invitations/{token}/accept:
    parameters: [{ $ref: "#/components/parameters/Token" }]
    post:
      tags: [orgs]
      operationId: acceptOrgInvitation
      responses:
        "200": { description: Joined, content: { application/json: { schema: { $ref: "#/components/schemas/Membership" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
  /orgs/{orgId}/attention:
    parameters: [{ $ref: "#/components/parameters/OrgId" }]
    get:
      tags: [orgs]
      operationId: getAttention
      summary: The "Needs you" list for the current user in this org
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/AttentionItem" } } } } }
  /orgs/{orgId}/audit:
    parameters: [{ $ref: "#/components/parameters/OrgId" }]
    get:
      tags: [orgs]
      operationId: listOrgAudit
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
        - { name: actorId, in: query, schema: { type: string } }
        - { name: action, in: query, schema: { type: string } }
        - { name: entityType, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AuditPage" } } } }
  /orgs/{orgId}/terms:
    parameters: [{ $ref: "#/components/parameters/OrgId" }]
    get:
      tags: [library]
      operationId: listTerms
      summary: Dictionary terms available to this org (system + org layers), for term pickers
      parameters:
        - { name: projectId, in: query, schema: { type: string, format: uuid } }
        - { name: q, in: query, schema: { type: string } }
        - { name: category, in: query, schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/TermInfo" } } } } }

  # ───────────────────────────── billing ─────────────────────────────
  /plans:
    get:
      tags: [billing]
      operationId: listPlans
      security: []
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Plan" } } } } }
  /orgs/{orgId}/entitlements:
    parameters: [{ $ref: "#/components/parameters/OrgId" }]
    get:
      tags: [billing]
      operationId: getEntitlements
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/EntitlementsResponse" } } } }
  /orgs/{orgId}/usage:
    parameters: [{ $ref: "#/components/parameters/OrgId" }]
    get:
      tags: [billing]
      operationId: getUsage
      parameters:
        - { name: month, in: query, description: "YYYY-MM, default current", schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/UsageResponse" } } } }
  /orgs/{orgId}/billing:
    parameters: [{ $ref: "#/components/parameters/OrgId" }]
    get:
      tags: [billing]
      operationId: getBilling
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Subscription" } } } }
  /orgs/{orgId}/billing/checkout:
    parameters: [{ $ref: "#/components/parameters/OrgId" }]
    post:
      tags: [billing]
      operationId: createCheckout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [planId, returnUrl]
              properties:
                planId: { type: string }
                returnUrl: { type: string }
      responses:
        "200": { description: Redirect target, content: { application/json: { schema: { $ref: "#/components/schemas/RedirectUrl" } } } }
  /orgs/{orgId}/billing/portal:
    parameters: [{ $ref: "#/components/parameters/OrgId" }]
    post:
      tags: [billing]
      operationId: createBillingPortal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [returnUrl]
              properties:
                returnUrl: { type: string }
      responses:
        "200": { description: Redirect target, content: { application/json: { schema: { $ref: "#/components/schemas/RedirectUrl" } } } }
  /webhooks/billing/{provider}:
    parameters:
      - { name: provider, in: path, required: true, schema: { type: string } }
    post:
      tags: [billing]
      operationId: billingWebhook
      security: []
      description: Called by the payment provider. Signature verified by the adapter.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object } } }
      responses:
        "200": { description: Accepted }
        "400": { $ref: "#/components/responses/BadRequest" }

  # ───────────────────────────── projects ─────────────────────────────
  /orgs/{orgId}/projects:
    parameters: [{ $ref: "#/components/parameters/OrgId" }]
    get:
      tags: [projects]
      operationId: listProjects
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [active, archived] } }
        - { name: q, in: query, schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ProjectListItem" } } } } }
    post:
      tags: [projects]
      operationId: createProject
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProjectCreate" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Project" } } } }
        "402": { $ref: "#/components/responses/LimitReached" }
  /projects/{projectId}:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    get:
      tags: [projects]
      operationId: getProject
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Project" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [projects]
      operationId: updateProject
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProjectUpdate" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Project" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
  /projects/{projectId}/archive:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    post:
      tags: [projects]
      operationId: archiveProject
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Project" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
  /projects/{projectId}/unarchive:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    post:
      tags: [projects]
      operationId: unarchiveProject
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Project" } } } }
        "402": { $ref: "#/components/responses/LimitReached" }
  /projects/{projectId}/members:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    get:
      tags: [projects]
      operationId: listProjectMembers
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ProjectMember" } } } } }
    post:
      tags: [projects]
      operationId: addProjectMember
      description: Add an org member by userId (project members are org members only, P28).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, role]
              properties:
                userId: { type: string, format: uuid }
                role: { $ref: "#/components/schemas/ProjectRole" }
      responses:
        "201": { description: Added, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectMember" } } } }
  /projects/{projectId}/members/{userId}:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }, { $ref: "#/components/parameters/UserId" }]
    patch:
      tags: [projects]
      operationId: updateProjectMember
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { $ref: "#/components/schemas/ProjectRole" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectMember" } } } }
    delete:
      tags: [projects]
      operationId: removeProjectMember
      responses:
        "204": { description: Removed }
  /projects/{projectId}/audit:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    get:
      tags: [projects]
      operationId: listProjectAudit
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
        - { name: actorId, in: query, schema: { type: string } }
        - { name: action, in: query, schema: { type: string } }
        - { name: entityType, in: query, schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AuditPage" } } } }
  /projects/{projectId}/audit.csv:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    get:
      tags: [exports]
      operationId: exportProjectAuditCsv
      responses:
        "200": { description: CSV, content: { text/csv: { schema: { type: string } } } }

  # ───────────────────────────── models ─────────────────────────────
  /projects/{projectId}/models:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    get:
      tags: [models]
      operationId: listModels
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Model" } } } } }
    post:
      tags: [models]
      operationId: createModel
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ModelCreate" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Model" } } } }
  /models/{modelId}:
    parameters: [{ $ref: "#/components/parameters/ModelId" }]
    get:
      tags: [models]
      operationId: getModel
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Model" } } } }
    patch:
      tags: [models]
      operationId: updateModel
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ModelUpdate" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Model" } } } }
    delete:
      tags: [models]
      operationId: archiveModel
      responses:
        "204": { description: Archived }
  /models/{modelId}/versions:
    parameters: [{ $ref: "#/components/parameters/ModelId" }]
    get:
      tags: [models]
      operationId: listModelVersions
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ModelVersion" } } } } }
    post:
      tags: [models]
      operationId: createModelVersion
      summary: Register a new version and get upload instructions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileName, sizeBytes]
              properties:
                fileName: { type: string }
                sizeBytes: { type: integer }
                sha256: { type: string }
                note: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [version, upload]
                properties:
                  version: { $ref: "#/components/schemas/ModelVersion" }
                  upload: { $ref: "#/components/schemas/UploadInstructions" }
        "402": { $ref: "#/components/responses/LimitReached" }
  /model-versions/{versionId}:
    parameters: [{ $ref: "#/components/parameters/VersionId" }]
    get:
      tags: [models]
      operationId: getModelVersion
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ModelVersion" } } } }
    delete:
      tags: [models]
      operationId: deleteModelVersion
      responses:
        "204": { description: Deleted or archived }
  /model-versions/{versionId}/complete:
    parameters: [{ $ref: "#/components/parameters/VersionId" }]
    post:
      tags: [models]
      operationId: completeModelUpload
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                parts:
                  type: array
                  items:
                    type: object
                    required: [partNumber, etag]
                    properties:
                      partNumber: { type: integer }
                      etag: { type: string }
      responses:
        "200": { description: Version queued or ready (deduplicated), content: { application/json: { schema: { $ref: "#/components/schemas/ModelVersion" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
  /model-versions/{versionId}/retry:
    parameters: [{ $ref: "#/components/parameters/VersionId" }]
    post:
      tags: [models]
      operationId: retryModelVersion
      responses:
        "200": { description: Re-queued, content: { application/json: { schema: { $ref: "#/components/schemas/ModelVersion" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
  /model-versions/{versionId}/geometry:
    parameters: [{ $ref: "#/components/parameters/VersionId" }]
    get:
      tags: [models]
      operationId: getModelGeometry
      responses:
        "302": { description: Redirect to a signed URL of geometry.glb }
  /model-versions/{versionId}/scene:
    parameters: [{ $ref: "#/components/parameters/VersionId" }]
    get:
      tags: [models]
      operationId: getModelScene
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SceneIndex" } } } }
  /model-versions/{versionId}/names:
    parameters: [{ $ref: "#/components/parameters/VersionId" }]
    post:
      tags: [models]
      operationId: namesInModel
      summary: Distinct names in the model and how given dictionaries resolve them (engine rpc)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                dictionaryVersionIds: { type: array, items: { type: string, format: uuid } }
                draftDictionaries:
                  type: array
                  description: Unsaved dictionary docs (Library editor), most specific last
                  items: { $ref: "../types/schema/dictionary.schema.json#/definitions/Dictionary" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/NamesResponse" } } } }

  # ───────────────────────────── library ─────────────────────────────
  /orgs/{orgId}/presets:
    parameters: [{ $ref: "#/components/parameters/OrgId" }]
    get:
      tags: [library]
      operationId: listPresets
      description: System presets plus this org's presets (and a project's, with projectId).
      parameters:
        - { name: kind, in: query, schema: { $ref: "#/components/schemas/PresetKind" } }
        - { name: layer, in: query, schema: { $ref: "#/components/schemas/PresetLayer" } }
        - { name: projectId, in: query, schema: { type: string, format: uuid } }
        - { name: includeArchived, in: query, schema: { type: boolean } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Preset" } } } } }
    post:
      tags: [library]
      operationId: createPreset
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PresetCreate" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Preset" } } } }
        "402": { $ref: "#/components/responses/LimitReached" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /presets/{presetId}:
    parameters: [{ $ref: "#/components/parameters/PresetId" }]
    get:
      tags: [library]
      operationId: getPreset
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Preset" } } } }
    patch:
      tags: [library]
      operationId: updatePreset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
                basedOn: { type: string }
                starred: { type: boolean }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Preset" } } } }
  /presets/{presetId}/archive:
    parameters: [{ $ref: "#/components/parameters/PresetId" }]
    post:
      tags: [library]
      operationId: archivePreset
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Preset" } } } }
  /presets/{presetId}/versions:
    parameters: [{ $ref: "#/components/parameters/PresetId" }]
    get:
      tags: [library]
      operationId: listPresetVersions
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/PresetVersionInfo" } } } } }
  /preset-versions/{presetVersionId}:
    parameters: [{ $ref: "#/components/parameters/PresetVersionId" }]
    get:
      tags: [library]
      operationId: getPresetVersion
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PresetVersion" } } } }
  /presets/{presetId}/draft:
    parameters: [{ $ref: "#/components/parameters/PresetId" }]
    put:
      tags: [library]
      operationId: saveDraft
      parameters:
        - { name: If-Match, in: header, schema: { type: string }, description: ETag of the draft last read }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [doc]
              properties:
                doc: { description: The engine document for this preset kind }
      responses:
        "200": { description: Saved and checked, content: { application/json: { schema: { $ref: "#/components/schemas/PresetVersion" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [library]
      operationId: discardDraft
      responses:
        "204": { description: Discarded }
  /presets/{presetId}/publish:
    parameters: [{ $ref: "#/components/parameters/PresetId" }]
    post:
      tags: [library]
      operationId: publishDraft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [changeNote]
              properties:
                changeNote: { type: string }
      responses:
        "200": { description: Published version, content: { application/json: { schema: { $ref: "#/components/schemas/PresetVersion" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
  /presets/check:
    post:
      tags: [library]
      operationId: checkPreset
      summary: Engine check of a document without saving (rpc)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, doc]
              properties:
                kind: { $ref: "#/components/schemas/PresetKind" }
                doc: { description: Engine document }
                parentVersionIds: { type: array, items: { type: string, format: uuid } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/CheckResponse" } } } }
  /presets/{presetId}/preview:
    parameters: [{ $ref: "#/components/parameters/PresetId" }]
    post:
      tags: [library]
      operationId: previewPreset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [modelVersionIds]
              properties:
                draft: { type: boolean, default: true }
                presetVersionId: { type: string, format: uuid }
                modelVersionIds: { type: array, items: { type: string, format: uuid } }
                compareWithPublished: { type: boolean, default: true }
                otherInputs: { $ref: "#/components/schemas/RevisionInputsPartial" }
      responses:
        "202": { $ref: "#/components/responses/JobAccepted" }
        "402": { $ref: "#/components/responses/LimitReached" }
  /presets/{presetId}/usage:
    parameters: [{ $ref: "#/components/parameters/PresetId" }]
    get:
      tags: [library]
      operationId: getPresetUsage
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/PresetUsage" } } } } }
  /codelists/read:
    post:
      tags: [library]
      operationId: readCodeListFile
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/TableReadResponse" } } } }
  /codelists/build:
    post:
      tags: [library]
      operationId: buildCodeList
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CodeListBuildRequest" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/CodeListBuildResponse" } } } }

  # ───────────────────────────── decisions ─────────────────────────────
  /projects/{projectId}/decisions:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    get:
      tags: [decisions]
      operationId: listDecisions
      parameters:
        - { name: kind, in: query, schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Decision" } } } } }
    post:
      tags: [decisions]
      operationId: upsertDecisions
      parameters:
        - { name: dryRun, in: query, schema: { type: boolean } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decisions]
              properties:
                decisions: { type: array, items: { $ref: "#/components/schemas/DecisionInput" } }
                addToProjectDictionary: { type: boolean, default: true }
      responses:
        "200":
          description: Saved (or, with dryRun, what would happen)
          content:
            application/json:
              schema:
                type: object
                required: [decisions, reopenedRevisions]
                properties:
                  decisions: { type: array, items: { $ref: "#/components/schemas/Decision" } }
                  reopenedRevisions: { type: array, items: { $ref: "#/components/schemas/RevisionRef" } }
  /decisions/{decisionId}:
    parameters: [{ $ref: "#/components/parameters/DecisionId" }]
    delete:
      tags: [decisions]
      operationId: clearDecision
      responses:
        "204": { description: Cleared }
  /decisions/{decisionId}/promote:
    parameters: [{ $ref: "#/components/parameters/DecisionId" }]
    post:
      tags: [decisions]
      operationId: promoteDecision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dictionaryPresetId]
              properties:
                dictionaryPresetId: { type: string, format: uuid }
      responses:
        "200": { description: New dictionary version published, content: { application/json: { schema: { $ref: "#/components/schemas/PresetVersion" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
  /projects/{projectId}/decisions.csv:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    get:
      tags: [exports]
      operationId: exportDecisionsCsv
      responses:
        "200": { description: CSV, content: { text/csv: { schema: { type: string } } } }

  # ───────────────────────────── boqs ─────────────────────────────
  /projects/{projectId}/boqs:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    get:
      tags: [boqs]
      operationId: listBoqs
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Boq" } } } } }
    post:
      tags: [boqs]
      operationId: createBoq
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                description: { type: string }
                inputs: { $ref: "#/components/schemas/RevisionInputsPartial" }
      responses:
        "201": { description: Created with revision A, content: { application/json: { schema: { $ref: "#/components/schemas/Boq" } } } }
        "402": { $ref: "#/components/responses/LimitReached" }
  /boqs/{boqId}:
    parameters: [{ $ref: "#/components/parameters/BoqId" }]
    get:
      tags: [boqs]
      operationId: getBoq
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Boq" } } } }
    patch:
      tags: [boqs]
      operationId: updateBoq
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
                archived: { type: boolean, description: false restores an archived BoQ (F04 §6) }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Boq" } } } }
  /boqs/{boqId}/archive:
    parameters: [{ $ref: "#/components/parameters/BoqId" }]
    post:
      tags: [boqs]
      operationId: archiveBoq
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Boq" } } } }
  /boqs/{boqId}/revisions:
    parameters: [{ $ref: "#/components/parameters/BoqId" }]
    get:
      tags: [boqs]
      operationId: listRevisions
      description: The working version and every saved version. The next working version is created automatically when a version is saved (F09 §2).
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/BoqRevision" } } } } }
  /boqs/{boqId}/confirm:
    parameters: [{ $ref: "#/components/parameters/BoqId" }]
    post:
      tags: [boqs]
      operationId: confirmBoq
      description: Mark the BoQ as done (F09 §5). Saves a final version first when the working version changed (same fields as saving a version).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string }
                note: { type: string }
                notModelledConfirmed: { type: boolean }
      responses:
        "200": { description: Confirmed, content: { application/json: { schema: { $ref: "#/components/schemas/Boq" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /boqs/{boqId}/reopen:
    parameters: [{ $ref: "#/components/parameters/BoqId" }]
    post:
      tags: [boqs]
      operationId: reopenBoq
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1 }
      responses:
        "200": { description: Reopened with a new working version, content: { application/json: { schema: { $ref: "#/components/schemas/Boq" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /revisions/{revisionId}:
    parameters: [{ $ref: "#/components/parameters/RevisionId" }]
    get:
      tags: [boqs]
      operationId: getRevision
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/BoqRevision" } } } }
    patch:
      tags: [boqs]
      operationId: updateRevisionInputs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inputs]
              properties:
                inputs: { $ref: "#/components/schemas/RevisionInputsPartial" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/BoqRevision" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
  /revisions/{revisionId}/runs:
    parameters: [{ $ref: "#/components/parameters/RevisionId" }]
    get:
      tags: [runs]
      operationId: listRuns
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Run" } } } } }
    post:
      tags: [runs]
      operationId: generateRun
      responses:
        "202":
          description: Run created and queued
          content:
            application/json:
              schema:
                type: object
                required: [run, job]
                properties:
                  run: { $ref: "#/components/schemas/Run" }
                  job: { $ref: "#/components/schemas/Job" }
        "402": { $ref: "#/components/responses/LimitReached" }
        "409": { $ref: "#/components/responses/Conflict" }
  /revisions/{revisionId}/submit:
    parameters: [{ $ref: "#/components/parameters/RevisionId" }]
    post:
      tags: [boqs]
      operationId: submitRevision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reviewerIds, notModelledConfirmed]
              properties:
                reviewerIds: { type: array, items: { type: string, format: uuid }, minItems: 1 }
                message: { type: string }
                notModelledConfirmed:
                  type: boolean
                  const: true
                  description: The submitter confirms that work not in the models was added (F09 §1, BR-12).
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/BoqRevision" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
  /revisions/{revisionId}/request-changes:
    parameters: [{ $ref: "#/components/parameters/RevisionId" }]
    post:
      tags: [boqs]
      operationId: requestRevisionChanges
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [comment]
              properties:
                comment: { type: string }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/BoqRevision" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
  /revisions/{revisionId}/approve:
    parameters: [{ $ref: "#/components/parameters/RevisionId" }]
    post:
      tags: [boqs]
      operationId: approveRevision
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                comment: { type: string }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/BoqRevision" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /revisions/{revisionId}/issue:
    parameters: [{ $ref: "#/components/parameters/RevisionId" }]
    post:
      tags: [boqs]
      operationId: issueRevision
      summary: Save version (P29)
      description: Locks the working version as a saved version and opens the next working version. With `approvalRequired` the revision must be `approved`. Open blocking questions are allowed and recorded.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string }
                note: { type: string }
                notModelledConfirmed: { type: boolean, description: "Required (true) when approval is off; with approval on it was given at submit (F09 §2, BR-12)" }
      responses:
        "200": { description: Saved (frozen export job started); the response is the saved version, content: { application/json: { schema: { $ref: "#/components/schemas/BoqRevision" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /revisions/{revisionId}/reopen:
    parameters: [{ $ref: "#/components/parameters/RevisionId" }]
    post:
      tags: [boqs]
      operationId: reopenRevision
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/BoqRevision" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
  /revisions/{revisionId}/comments:
    parameters: [{ $ref: "#/components/parameters/RevisionId" }]
    post:
      tags: [boqs]
      operationId: addReviewComment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string }
                lineKey: { type: string }
      responses:
        "201": { description: Added, content: { application/json: { schema: { $ref: "#/components/schemas/ReviewComment" } } } }
  /revisions/{revisionId}/exports:
    parameters: [{ $ref: "#/components/parameters/RevisionId" }]
    get:
      tags: [exports]
      operationId: listRevisionExports
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Export" } } } } }

  # ───────────────────────────── adjustments ─────────────────────────────
  /boqs/{boqId}/overrides:
    parameters: [{ $ref: "#/components/parameters/BoqId" }]
    get:
      tags: [adjustments]
      operationId: listOverrides
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/LineOverride" } } } } }
    post:
      tags: [adjustments]
      operationId: setOverride
      summary: Create or replace the edits of one line (by lineKey); see F06 §6
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LineOverrideInput" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/LineOverride" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
  /overrides/{overrideId}:
    parameters: [{ $ref: "#/components/parameters/OverrideId" }]
    delete:
      tags: [adjustments]
      operationId: removeOverride
      responses:
        "204": { description: Removed }
        "409": { $ref: "#/components/responses/Conflict" }
  /boqs/{boqId}/manual-items:
    parameters: [{ $ref: "#/components/parameters/BoqId" }]
    get:
      tags: [adjustments]
      operationId: listManualItems
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ManualItemRecord" } } } } }
    post:
      tags: [adjustments]
      operationId: addManualItem
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ManualItemInput" } } }
      responses:
        "201": { description: Added, content: { application/json: { schema: { $ref: "#/components/schemas/ManualItemRecord" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
  /manual-items/{itemId}:
    parameters: [{ $ref: "#/components/parameters/ManualItemId" }]
    patch:
      tags: [adjustments]
      operationId: updateManualItem
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ManualItemInput" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ManualItemRecord" } } } }
    delete:
      tags: [adjustments]
      operationId: removeManualItem
      responses:
        "204": { description: Removed }

  # ───────────────────────────── runs ─────────────────────────────
  /runs/{runId}:
    parameters: [{ $ref: "#/components/parameters/RunId" }]
    get:
      tags: [runs]
      operationId: getRun
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Run" } } } }
  /runs/{runId}/result:
    parameters: [{ $ref: "#/components/parameters/RunId" }]
    get:
      tags: [runs]
      operationId: getRunResult
      responses:
        "302": { description: Redirect to a signed URL of the full BoqResult JSON (gzip) }
  /runs/{runId}/lines:
    parameters: [{ $ref: "#/components/parameters/RunId" }]
    get:
      tags: [runs]
      operationId: listLines
      description: |
        All lines (default, for runs up to 20,000 lines) or grouped server-side when
        `groupBy` and `level` are given (large runs: group rows, then lines per group with `groupPath`).
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - { name: limit, in: query, schema: { type: integer, default: 5000, maximum: 20000 } }
        - { name: groupBy, in: query, description: classification id, schema: { type: string } }
        - { name: level, in: query, schema: { type: integer } }
        - { name: groupPath, in: query, description: "code path prefix, e.g. 2/2.5", schema: { type: string } }
        - { name: source, in: query, schema: { type: string, enum: [measured, derived, manual, flagged, overridden] } }
        - { name: storey, in: query, schema: { type: string } }
        - { name: family, in: query, schema: { type: string } }
        - { name: modelId, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/LinesPage" } } } }
  /runs/{runId}/lines/by-key:
    parameters: [{ $ref: "#/components/parameters/RunId" }]
    get:
      tags: [runs]
      operationId: getLine
      parameters:
        - { name: key, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/LineDetail" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /runs/{runId}/questions:
    parameters: [{ $ref: "#/components/parameters/RunId" }]
    get:
      tags: [runs]
      operationId: listQuestions
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/QuestionWithDecision" } } } } }
  /runs/{runId}/warnings:
    parameters: [{ $ref: "#/components/parameters/RunId" }]
    get:
      tags: [runs]
      operationId: listWarnings
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "../types/schema/boq-result.schema.json#/definitions/Warning" } } } } }
  /runs/{runId}/log:
    parameters: [{ $ref: "#/components/parameters/RunId" }]
    get:
      tags: [runs]
      operationId: listLog
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
        - { name: stage, in: query, schema: { type: string } }
        - { name: level, in: query, schema: { type: string, enum: [info, detail, warning] } }
        - { name: ruleId, in: query, schema: { type: string } }
        - { name: lineKey, in: query, schema: { type: string } }
        - { name: guid, in: query, schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/LogPage" } } } }
  /runs/{runId}/elements/{guid}:
    parameters: [{ $ref: "#/components/parameters/RunId" }, { name: guid, in: path, required: true, schema: { type: string } }]
    get:
      tags: [runs]
      operationId: getElementLines
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ElementLines" } } } }
  /runs/{runId}/coverage:
    parameters: [{ $ref: "#/components/parameters/RunId" }]
    get:
      tags: [runs]
      operationId: getCoverage
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Coverage" } } } }
  /runs/{runId}/compare:
    parameters: [{ $ref: "#/components/parameters/RunId" }]
    post:
      tags: [diffs]
      operationId: compareRuns
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [againstRunId]
              properties:
                againstRunId: { type: string, format: uuid, description: The older run (from) }
      responses:
        "200": { description: Cached diff, content: { application/json: { schema: { $ref: "#/components/schemas/RunDiff" } } } }
        "202": { $ref: "#/components/responses/JobAccepted" }
  /runs/{runId}/exports:
    parameters: [{ $ref: "#/components/parameters/RunId" }]
    post:
      tags: [exports]
      operationId: exportRun
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                format: { type: string, enum: [xlsx], default: xlsx }
                groupBy: { type: string, description: classification id }
      responses:
        "202": { $ref: "#/components/responses/JobAccepted" }

  # ───────────────────────────── diffs ─────────────────────────────
  /diffs/{diffId}:
    parameters: [{ $ref: "#/components/parameters/DiffId" }]
    get:
      tags: [diffs]
      operationId: getDiff
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/RunDiff" } } } }
  /diffs/{diffId}/lines:
    parameters: [{ $ref: "#/components/parameters/DiffId" }]
    get:
      tags: [diffs]
      operationId: listDiffLines
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
        - { name: change, in: query, schema: { type: string, enum: [added, removed, changed] } }
        - { name: minDeltaPct, in: query, schema: { type: number } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/LineChange" } }
                  nextCursor: { type: [string, "null"] }
  /diffs/{diffId}/elements:
    parameters: [{ $ref: "#/components/parameters/DiffId" }]
    get:
      tags: [diffs]
      operationId: listDiffElements
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ElementChange" } }
                  nextCursor: { type: [string, "null"] }
  /diffs/{diffId}/export:
    parameters: [{ $ref: "#/components/parameters/DiffId" }]
    post:
      tags: [exports]
      operationId: exportDiff
      responses:
        "202": { $ref: "#/components/responses/JobAccepted" }

  # ───────────────────────────── exports ─────────────────────────────
  /exports/{exportId}:
    parameters: [{ $ref: "#/components/parameters/ExportId" }]
    get:
      tags: [exports]
      operationId: getExport
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Export" } } } }
  /exports/{exportId}/download:
    parameters: [{ $ref: "#/components/parameters/ExportId" }]
    get:
      tags: [exports]
      operationId: downloadExport
      responses:
        "302": { description: Redirect to a signed URL }

  # ───────────────────────────── jobs, events, notifications ─────────────────────────────
  /jobs/{jobId}:
    parameters: [{ $ref: "#/components/parameters/JobId" }]
    get:
      tags: [jobs]
      operationId: getJob
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Job" } } } }
  /jobs/{jobId}/cancel:
    parameters: [{ $ref: "#/components/parameters/JobId" }]
    post:
      tags: [jobs]
      operationId: cancelJob
      responses:
        "200": { description: Cancel requested, content: { application/json: { schema: { $ref: "#/components/schemas/Job" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
  /events:
    get:
      tags: [events]
      operationId: streamEvents
      description: Server-Sent Events. Event names and payloads in conventions.md (`job.progress`, `job.finished`, `notification.created`, `entity.changed`).
      parameters:
        - { name: Last-Event-ID, in: header, schema: { type: string } }
      responses:
        "200": { description: Event stream, content: { text/event-stream: { schema: { type: string } } } }
  /notifications:
    get:
      tags: [notifications]
      operationId: listNotifications
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
        - { name: unreadOnly, in: query, schema: { type: boolean } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, unreadCount]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Notification" } }
                  unreadCount: { type: integer }
                  nextCursor: { type: [string, "null"] }
  /notifications/{notificationId}/read:
    parameters: [{ $ref: "#/components/parameters/NotificationId" }]
    post:
      tags: [notifications]
      operationId: markNotificationRead
      responses:
        "204": { description: OK }
  /notifications/read-all:
    post:
      tags: [notifications]
      operationId: markAllNotificationsRead
      responses:
        "204": { description: OK }

  # ───────────────────────────── sessions (F01 §10, BR-54) ─────────────────────────────
  /sessions:
    post:
      tags: [sessions]
      operationId: openSession
      description: Called after the auth adapter signs the user in. `409 session_active` when another session of the account is active, unless `takeover` is true.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceLabel]
              properties:
                deviceLabel: { type: string }
                takeover: { type: boolean, default: false }
      responses:
        "201": { description: Session opened, content: { application/json: { schema: { $ref: "#/components/schemas/Session" } } } }
        "409": { description: Another session is active, content: { application/json: { schema: { $ref: "#/components/schemas/SessionConflict" } } } }
  /sessions/current:
    get:
      tags: [sessions]
      operationId: getCurrentSession
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Session" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    delete:
      tags: [sessions]
      operationId: closeCurrentSession
      responses:
        "204": { description: Signed out }

  # ───────────────────────────── line edits in bulk, Excel round-trip (F06, F12) ─────────────────────────────
  /boqs/{boqId}/overrides/batch:
    parameters: [{ $ref: "#/components/parameters/BoqId" }]
    post:
      tags: [adjustments]
      operationId: applyLineEdits
      description: Apply several line edits and manual lines at once (bulk actions, Excel import review). All or nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                overrides: { type: array, items: { $ref: "#/components/schemas/LineOverrideInput" } }
                removeOverrideLineKeys: { type: array, items: { type: string } }
                manualItems: { type: array, items: { $ref: "#/components/schemas/ManualItemInput" } }
      responses:
        "200":
          description: Applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  overrides: { type: array, items: { $ref: "#/components/schemas/LineOverride" } }
                  manualItems: { type: array, items: { $ref: "#/components/schemas/ManualItemRecord" } }
        "409": { $ref: "#/components/responses/Conflict" }
  /revisions/{revisionId}/edits-import:
    parameters: [{ $ref: "#/components/parameters/RevisionId" }]
    post:
      tags: [exports]
      operationId: importBoqEdits
      description: Upload an edited BoQ Excel (F12). Starts an `import_boq_edits` job whose output is an `EditsImportReport`; nothing is applied until the user applies the reviewed edits through `applyLineEdits`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "202": { $ref: "#/components/responses/JobAccepted" }
        "409": { $ref: "#/components/responses/Conflict" }

  /jobs/{jobId}/edits-import-report:
    parameters: [{ $ref: "#/components/parameters/JobId" }]
    get:
      tags: [exports]
      operationId: getEditsImportReport
      description: The review list of a finished `import_boq_edits` job.
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/EditsImportReport" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  # ───────────────────────────── preset Excel templates (F10 §14) ─────────────────────────────
  /presets/{presetId}/template.xlsx:
    parameters: [{ $ref: "#/components/parameters/PresetId" }]
    get:
      tags: [library]
      operationId: downloadPresetTemplate
      parameters:
        - { name: source, in: query, schema: { type: string, enum: [draft, latest, empty], default: draft } }
      responses:
        "302": { description: Redirect to a signed URL of the generated workbook }
  /presets/{presetId}/template-import:
    parameters: [{ $ref: "#/components/parameters/PresetId" }]
    post:
      tags: [library]
      operationId: importPresetTemplate
      description: Read a filled-in template. Returns the proposed draft, the changes against the current draft and the problems; saves nothing.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "200": { description: Proposed draft, content: { application/json: { schema: { $ref: "#/components/schemas/TemplateImportResult" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }

  # ───────────────────────────── share links (F18) ─────────────────────────────
  /boqs/{boqId}/share-links:
    parameters: [{ $ref: "#/components/parameters/BoqId" }]
    get:
      tags: [sharing]
      operationId: listShareLinks
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ShareLink" } } } } }
    post:
      tags: [sharing]
      operationId: createShareLink
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ShareLinkCreate" } } }
      responses:
        "201": { description: Created; the only response that contains the full URL with its token, content: { application/json: { schema: { $ref: "#/components/schemas/ShareLinkCreated" } } } }
        "402": { $ref: "#/components/responses/LimitReached" }
        "409": { $ref: "#/components/responses/Conflict" }
  /share-links/{shareLinkId}:
    parameters: [{ $ref: "#/components/parameters/ShareLinkId" }]
    patch:
      tags: [sharing]
      operationId: updateShareLink
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string }
                include: { $ref: "#/components/schemas/ShareInclude" }
                expiresAt: { type: [string, "null"], format: date-time }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ShareLink" } } } }
    delete:
      tags: [sharing]
      operationId: revokeShareLink
      responses:
        "204": { description: Revoked }
  /orgs/{orgId}/share-links:
    parameters: [{ $ref: "#/components/parameters/OrgId" }]
    get:
      tags: [sharing]
      operationId: listOrgShareLinks
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ShareLink" } } } } }
  /public/shares/{token}:
    parameters: [{ $ref: "#/components/parameters/Token" }]
    get:
      tags: [public]
      operationId: getPublicShare
      security: []
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PublicShare" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /public/shares/{token}/lines:
    parameters: [{ $ref: "#/components/parameters/Token" }]
    get:
      tags: [public]
      operationId: listPublicShareLines
      security: []
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - { name: q, in: query, schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/LinesPage" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /public/shares/{token}/lines/by-key:
    parameters: [{ $ref: "#/components/parameters/Token" }]
    get:
      tags: [public]
      operationId: getPublicShareLine
      security: []
      parameters:
        - { name: key, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: OK (only when the link includes line detail), content: { application/json: { schema: { $ref: "#/components/schemas/LineDetail" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /public/shares/{token}/scene:
    parameters: [{ $ref: "#/components/parameters/Token" }]
    get:
      tags: [public]
      operationId: getPublicShareScene
      security: []
      responses:
        "200": { description: OK (only when the link includes the viewer), content: { application/json: { schema: { $ref: "#/components/schemas/SceneIndex" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /public/shares/{token}/geometry/{versionId}:
    parameters: [{ $ref: "#/components/parameters/Token" }, { $ref: "#/components/parameters/VersionId" }]
    get:
      tags: [public]
      operationId: getPublicShareGeometry
      security: []
      responses:
        "302": { description: Redirect to a short-lived signed URL of geometry.glb }
        "404": { $ref: "#/components/responses/NotFound" }
  /public/shares/{token}/export:
    parameters: [{ $ref: "#/components/parameters/Token" }]
    get:
      tags: [public]
      operationId: getPublicShareExport
      security: []
      responses:
        "302": { description: Redirect to a short-lived signed URL of the Excel (only when included) }
        "404": { $ref: "#/components/responses/NotFound" }

  # ───────────────────────────── platform admin (F19) ─────────────────────────────
  /admin/overview:
    get:
      tags: [admin]
      operationId: adminOverview
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AdminOverview" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/funnel:
    get:
      tags: [admin]
      operationId: adminFunnel
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AdminFunnel" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/orgs:
    get:
      tags: [admin]
      operationId: adminListOrgs
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
        - { name: plan, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - { name: tag, in: query, schema: { type: string } }
        - { name: signal, in: query, schema: { type: string, enum: [hit_limit, inactive_30d, trial_ending_7d, stuck_in_setup] } }
        - { name: q, in: query, schema: { type: string } }
        - { name: sort, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AdminOrgRow" } }
                  nextCursor: { type: [string, "null"] }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/orgs.csv:
    get:
      tags: [admin]
      operationId: adminExportOrgs
      responses:
        "200": { description: CSV of the orgs table, content: { text/csv: { schema: { type: string } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/orgs/{orgId}:
    parameters: [{ $ref: "#/components/parameters/OrgId" }]
    get:
      tags: [admin]
      operationId: adminGetOrg
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AdminOrgDetail" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [admin]
      operationId: adminUpdateOrg
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                tags: { type: array, items: { type: string } }
                status: { type: string, enum: [active, suspended] }
                reason: { type: string, minLength: 1 }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AdminOrgDetail" } } } }
  /admin/orgs/{orgId}/subscription:
    parameters: [{ $ref: "#/components/parameters/OrgId" }]
    put:
      tags: [admin]
      operationId: adminSetSubscription
      description: Change plan or trial through the `manual` billing provider (F14). Audited, visible in the org's audit log.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                planId: { type: string }
                trialEndsAt: { type: [string, "null"], format: date-time }
                reason: { type: string, minLength: 1 }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AdminOrgDetail" } } } }
  /admin/orgs/{orgId}/entitlement-overrides:
    parameters: [{ $ref: "#/components/parameters/OrgId" }]
    put:
      tags: [admin]
      operationId: adminSetEntitlementOverrides
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [overrides, reason]
              properties:
                overrides: { type: object, additionalProperties: true, description: "entitlement name → value; null removes the override" }
                reason: { type: string, minLength: 1 }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AdminOrgDetail" } } } }
  /admin/orgs/{orgId}/notes:
    parameters: [{ $ref: "#/components/parameters/OrgId" }]
    get:
      tags: [admin]
      operationId: adminListNotes
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/AdminNote" } } } } }
    post:
      tags: [admin]
      operationId: adminAddNote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 1 }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/AdminNote" } } } }
  /admin/users:
    get:
      tags: [admin]
      operationId: adminListUsers
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
        - { name: q, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AdminUserRow" } }
                  nextCursor: { type: [string, "null"] }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/users/{userId}/session:
    parameters: [{ $ref: "#/components/parameters/UserId" }]
    delete:
      tags: [admin]
      operationId: adminEndUserSession
      responses:
        "204": { description: The user's active session ended }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/health:
    get:
      tags: [admin]
      operationId: adminHealth
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  failedJobsPerDay: { type: array, items: { type: object, properties: { date: { type: string, format: date }, count: { type: integer } } } }
                  jobDurationsMs: { type: object, additionalProperties: { type: object, properties: { p50: { type: number }, p95: { type: number } } } }
                  billingWebhookFailures: { type: integer }
                  emailBounces: { type: integer }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: Token from the auth adapter (provider to be decided, P10). Cookie sessions are equally acceptable; see conventions.md.

  parameters:
    OrgId: { name: orgId, in: path, required: true, schema: { type: string, format: uuid } }
    UserId: { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    InvitationId: { name: invitationId, in: path, required: true, schema: { type: string, format: uuid } }
    Token: { name: token, in: path, required: true, schema: { type: string } }
    ProjectId: { name: projectId, in: path, required: true, schema: { type: string, format: uuid } }
    ModelId: { name: modelId, in: path, required: true, schema: { type: string, format: uuid } }
    VersionId: { name: versionId, in: path, required: true, schema: { type: string, format: uuid } }
    PresetId: { name: presetId, in: path, required: true, schema: { type: string, format: uuid } }
    PresetVersionId: { name: presetVersionId, in: path, required: true, schema: { type: string, format: uuid } }
    DecisionId: { name: decisionId, in: path, required: true, schema: { type: string, format: uuid } }
    BoqId: { name: boqId, in: path, required: true, schema: { type: string, format: uuid } }
    RevisionId: { name: revisionId, in: path, required: true, schema: { type: string, format: uuid } }
    RunId: { name: runId, in: path, required: true, schema: { type: string, format: uuid } }
    DiffId: { name: diffId, in: path, required: true, schema: { type: string, format: uuid } }
    OverrideId: { name: overrideId, in: path, required: true, schema: { type: string, format: uuid } }
    ManualItemId: { name: itemId, in: path, required: true, schema: { type: string, format: uuid } }
    ExportId: { name: exportId, in: path, required: true, schema: { type: string, format: uuid } }
    JobId: { name: jobId, in: path, required: true, schema: { type: string, format: uuid } }
    NotificationId: { name: notificationId, in: path, required: true, schema: { type: string, format: uuid } }
    ShareLinkId: { name: shareLinkId, in: path, required: true, schema: { type: string, format: uuid } }
    Cursor: { name: cursor, in: query, schema: { type: string } }
    Limit: { name: limit, in: query, schema: { type: integer, default: 100, maximum: 1000 } }

  responses:
    BadRequest:
      description: Invalid input
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unauthenticated:
      description: Not signed in
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    LimitReached:
      description: Plan limit reached
      content: { application/json: { schema: { $ref: "#/components/schemas/LimitError" } } }
    Forbidden:
      description: Not allowed for this role
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: Not found or not visible to the caller
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Conflict:
      description: Blocked by state (code says why)
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    JobAccepted:
      description: Job created
      content: { application/json: { schema: { $ref: "#/components/schemas/Job" } } }

  schemas:
    # ── sessions (F01 §10) ──
    Session:
      type: object
      required: [id, status, deviceLabel, lastSeenAt]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [active, ended, replaced, expired] }
        deviceLabel: { type: string }
        place: { type: string }
        lastSeenAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    SessionConflict:
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          required: [activeSession]
          properties:
            activeSession: { $ref: "#/components/schemas/Session" }

    # ── line edits import, preset templates ──
    EditsImportReport:
      type: object
      description: Output of an `import_boq_edits` job (F12). Proposals only.
      required: [overrides, manualItems, problems]
      properties:
        overrides:
          type: array
          items:
            type: object
            required: [edit, change]
            properties:
              edit: { $ref: "#/components/schemas/LineOverrideInput" }
              change: { type: string, enum: [quantity, description, unit, moved, excluded, mixed] }
              row: { type: integer }
        manualItems:
          type: array
          items:
            type: object
            properties:
              item: { $ref: "#/components/schemas/ManualItemInput" }
              row: { type: integer }
        problems:
          type: array
          items:
            type: object
            required: [row, message]
            properties:
              sheet: { type: string }
              row: { type: integer }
              column: { type: string }
              message: { type: string }
    TemplateImportResult:
      type: object
      required: [doc, changes, problems]
      properties:
        doc: { type: object, additionalProperties: true, description: The proposed draft document (engine shape of the preset kind) }
        changes:
          type: array
          items:
            type: object
            required: [what, summary]
            properties:
              what: { type: string, enum: [answer, code, item_text, code_mapping, name, other] }
              summary: { type: string }
              before: {}
              after: {}
        problems:
          type: array
          items:
            type: object
            required: [message]
            properties:
              sheet: { type: string }
              row: { type: integer }
              column: { type: string }
              message: { type: string }

    # ── share links (F18) ──
    ShareInclude:
      type: object
      properties:
        lineDetail: { type: boolean, default: true }
        viewer: { type: boolean, default: true }
        log: { type: boolean, default: false }
        excel: { type: boolean, default: false }
        groupBy: { type: string, description: classification id }
    ShareLinkCreate:
      type: object
      required: [mode]
      properties:
        mode: { type: string, enum: [pinned, latest_issued] }
        revisionId: { type: string, format: uuid, description: for pinned links; its current run is pinned }
        include: { $ref: "#/components/schemas/ShareInclude" }
        label: { type: string }
        expiresAt: { type: [string, "null"], format: date-time }
    ShareLink:
      type: object
      required: [id, boqId, mode, include, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        boqId: { type: string, format: uuid }
        mode: { type: string, enum: [pinned, latest_issued] }
        runId: { type: [string, "null"], format: uuid }
        include: { $ref: "#/components/schemas/ShareInclude" }
        label: { type: string }
        status: { type: string, enum: [active, revoked, expired, suspended] }
        expiresAt: { type: [string, "null"], format: date-time }
        views: { type: integer }
        lastViewedAt: { type: [string, "null"], format: date-time }
        createdBy: { $ref: "#/components/schemas/UserRef" }
        createdAt: { type: string, format: date-time }
    ShareLinkCreated:
      allOf:
        - $ref: "#/components/schemas/ShareLink"
        - type: object
          required: [url]
          properties:
            url: { type: string, description: "Full public URL with the token. Shown once: the token is stored hashed." }
    PublicShare:
      type: object
      description: What a public visitor sees (BR-56). No member names, decisions, questions, vendors or prices.
      required: [firmName, projectName, boqName, revisionLabel, revisionStatus, runAt, include]
      properties:
        firmName: { type: string }
        projectName: { type: string }
        boqName: { type: string }
        revisionLabel: { type: string }
        revisionStatus: { type: string, enum: [draft, in_review, approved, issued] }
        runAt: { type: string, format: date-time }
        include: { $ref: "#/components/schemas/ShareInclude" }
        modelVersionIds: { type: array, items: { type: string, format: uuid }, description: for the viewer when included }
        madeWithBadge: { type: boolean }

    # ── platform admin (F19) ──
    AdminOverview:
      type: object
      properties:
        period: { type: object, properties: { from: { type: string, format: date }, to: { type: string, format: date } } }
        tiles:
          type: object
          description: "name → {value, previous, series[]}: signUps, newOrgs, activeOrgs, payingOrgs, revenue, seatsUsed, seatsAvailable, activeProjects, modelsParsed, runs, processingMinutes, exports, savedVersions, confirmedBoqs, shareLinkViews; modules add theirs (admin.metrics)"
          additionalProperties:
            type: object
            properties:
              value: { type: [number, "null"] }
              previous: { type: [number, "null"] }
              series: { type: array, items: { type: number } }
        orgsByPlan: { type: object, additionalProperties: { type: integer } }
    AdminFunnel:
      type: object
      properties:
        steps:
          type: array
          items:
            type: object
            required: [step, orgs]
            properties:
              step: { type: string, enum: [signed_up, org_created, setup_done, first_model_ready, first_boq, first_saved_version, first_export_or_share] }
              orgs: { type: integer }
              conversionPct: { type: number }
              medianHoursFromPrevious: { type: [number, "null"] }
        cohorts:
          type: array
          items:
            type: object
            properties:
              week: { type: string }
              counts: { type: array, items: { type: integer } }
    AdminOrgRow:
      type: object
      required: [id, name, planId, status]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        country: { type: string }
        planId: { type: string }
        status: { type: string }
        subscriptionStatus: { type: string }
        trialEndsAt: { type: [string, "null"], format: date-time }
        seats: { type: object, properties: { used: { type: integer }, max: { type: [integer, "null"] } } }
        activeProjects: { type: object, properties: { used: { type: integer }, max: { type: [integer, "null"] } } }
        processingMinutes: { type: object, properties: { used: { type: number }, max: { type: [number, "null"] } } }
        limitHits30d: { type: integer }
        lastActivityAt: { type: [string, "null"], format: date-time }
        ownerEmail: { type: string }
        tags: { type: array, items: { type: string } }
        createdAt: { type: string, format: date-time }
    AdminOrgDetail:
      allOf:
        - $ref: "#/components/schemas/AdminOrgRow"
        - type: object
          description: Metadata and counts only (BR-57).
          properties:
            settings: { $ref: "#/components/schemas/OrgSettings" }
            entitlements: { type: object, additionalProperties: true }
            overrides: { type: object, additionalProperties: true }
            planHistory: { type: array, items: { type: object, properties: { planId: { type: string }, at: { type: string, format: date-time }, by: { type: string } } } }
            members:
              type: array
              items:
                type: object
                properties:
                  userId: { type: string, format: uuid }
                  name: { type: string }
                  email: { type: string }
                  role: { $ref: "#/components/schemas/OrgRole" }
                  lastActiveAt: { type: [string, "null"], format: date-time }
                  activeSession: { type: boolean }
            counts: { type: object, additionalProperties: { type: integer }, description: "projectsActive, projectsArchived, models, versions, boqs, confirmedBoqs, runs, exports, shareLinks; plus module counters" }
            usageByMonth: { type: array, items: { type: object, properties: { month: { type: string }, kind: { type: string }, minutes: { type: number } } } }
            limitEvents: { type: array, items: { type: object, properties: { limit: { type: string }, current: { type: number }, max: { type: number }, action: { type: string }, at: { type: string, format: date-time } } } }
            setup: { $ref: "#/components/schemas/OrgSetup" }
    AdminUserRow:
      type: object
      required: [id, name, email]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string }
        orgs: { type: array, items: { type: object, properties: { orgId: { type: string, format: uuid }, orgName: { type: string }, role: { $ref: "#/components/schemas/OrgRole" } } } }
        lastSignInAt: { type: [string, "null"], format: date-time }
        activeSession: { $ref: "#/components/schemas/Session" }
        createdAt: { type: string, format: date-time }
    AdminNote:
      type: object
      required: [id, text, author, createdAt]
      properties:
        id: { type: string, format: uuid }
        text: { type: string }
        author: { $ref: "#/components/schemas/UserRef" }
        createdAt: { type: string, format: date-time }

    # ── common ──
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, description: "machine code, e.g. revision_locked, invalid_transition, deadline_passed" }
        message: { type: string }
        details: { type: object, additionalProperties: true }
    LimitError:
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          required: [limit, current, max]
          properties:
            limit: { type: string }
            current: { type: number }
            max: { type: number }
    UserRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string }
    RedirectUrl:
      type: object
      required: [url]
      properties:
        url: { type: string }
    UploadInstructions:
      type: object
      required: [method, url]
      properties:
        method: { type: string, enum: [PUT] }
        url: { type: string, description: Signed URL (single-part) }
        headers: { type: object, additionalProperties: { type: string } }
        expiresAt: { type: string, format: date-time }
        parts:
          type: array
          description: Multipart upload URLs for files over 100 MB
          items:
            type: object
            required: [partNumber, url]
            properties:
              partNumber: { type: integer }
              url: { type: string }
        partSizeBytes: { type: integer }
    Permissions:
      type: object
      description: What the caller may do on this resource (UI hints; the API enforces anyway)
      additionalProperties: { type: boolean }

    # ── identity ──
    User:
      type: object
      required: [id, email, name, locale]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        name: { type: string }
        locale: { type: string }
        platformRole: { type: string, enum: [admin], description: Operators of the product only (F19) }
    Me:
      type: object
      required: [user, memberships]
      properties:
        user: { $ref: "#/components/schemas/User" }
        memberships:
          type: array
          items:
            type: object
            required: [org, role]
            properties:
              org: { $ref: "#/components/schemas/Org" }
              role: { $ref: "#/components/schemas/OrgRole" }
        session: { $ref: "#/components/schemas/Session" }
        modules:
          type: object
          description: Fields added by installed modules under their key (e.g. `pricing`); empty when none are installed (P36).
          additionalProperties: { type: object, additionalProperties: true }
    OrgRole: { type: string, enum: [owner, admin, library_editor, member] }
    Org:
      type: object
      required: [id, name, slug, settings, planId]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        planId: { type: string }
        settings: { $ref: "#/components/schemas/OrgSettings" }
        setup: { $ref: "#/components/schemas/OrgSetup" }
        createdAt: { type: string, format: date-time }
    OrgSetup:
      type: object
      description: Setup wizard progress (F16). The drafts it created are ordinary presets.
      required: [status, step, updatedAt]
      properties:
        status: { type: string, enum: [in_progress, done] }
        step: { type: string, enum: [start, measure, items, names, review] }
        modelVersionId: { type: string, format: uuid, description: the model version the preview runs on }
        ruleSetPresetId: { type: string, format: uuid }
        classificationPresetId: { type: string, format: uuid }
        dictionaryPresetId: { type: string, format: uuid }
        startedBy: { $ref: "#/components/schemas/UserRef" }
        updatedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
    OrgSetupUpdate:
      type: object
      properties:
        status: { type: string, enum: [in_progress, done] }
        step: { type: string, enum: [start, measure, items, names, review] }
        modelVersionId: { type: [string, "null"], format: uuid }
        ruleSetPresetId: { type: string, format: uuid }
        classificationPresetId: { type: string, format: uuid }
        dictionaryPresetId: { type: string, format: uuid }
    OrgSettings:
      type: object
      properties:
        fourEyes: { type: boolean }
        defaultLocale: { type: string }
        defaultCurrency: { type: string }
        defaultUnitSystem: { type: string, enum: [metric, imperial] }
        defaultCountry: { type: string }
        publicLinksAllowed: { type: boolean, default: true }
        approvalRequired: { type: boolean, default: false, description: "Saving a version needs review and approval (F09 §4, P29)" }
        numberFormat:
          type: object
          description: Overrides the locale's separators (P35)
          properties:
            decimal: { type: string, enum: [".", ","] }
            thousands: { type: string, enum: [",", ".", " ", " ", "'", ""], description: "U+202F (narrow no-break space) is the default for new orgs (F15)" }
        dateFormat: { type: string, description: "e.g. dd.MM.yyyy (P35)" }
        defaultLanguage: { type: string, default: en }
    OrgCreate:
      type: object
      required: [name, slug]
      properties:
        name: { type: string }
        slug: { type: string, pattern: "^[a-z0-9-]{3,40}$" }
        settings: { $ref: "#/components/schemas/OrgSettings" }
    OrgUpdate:
      type: object
      properties:
        name: { type: string }
        slug: { type: string, pattern: "^[a-z0-9-]{3,40}$" }
        settings: { $ref: "#/components/schemas/OrgSettings" }
    Membership:
      type: object
      required: [user, role, createdAt]
      properties:
        user: { $ref: "#/components/schemas/User" }
        role: { $ref: "#/components/schemas/OrgRole" }
        createdAt: { type: string, format: date-time }
        lastActiveAt: { type: string, format: date-time }
    OrgInvitation:
      type: object
      required: [id, email, role, status, expiresAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        role: { $ref: "#/components/schemas/OrgRole" }
        status: { type: string, enum: [pending, accepted, revoked, expired] }
        expiresAt: { type: string, format: date-time }
        invitedBy: { $ref: "#/components/schemas/UserRef" }
    NotificationPreferences:
      type: object
      properties:
        email:
          type: object
          description: "Category → on/off. Core categories: jobs, versions, reviews, membership, limits; modules add theirs (e.g. pricing)"
          additionalProperties: { type: boolean }

    # ── billing ──
    Entitlements:
      type: object
      description: Core limits and features; modules add their own keys (e.g. pricingModule, openOfferRequests).
      additionalProperties: true
      properties:
        seats: { type: integer }
        activeProjects: { type: integer }
        maxModelVersionMb: { type: integer }
        maxModelsPerBoq: { type: integer }
        processingMinutesPerMonth: { type: integer }
        libraryOrgPresets: { type: integer }
        auditLogRetentionDays: { type: integer }
        approvalWorkflow: { type: boolean }
        shareLinks: { type: boolean }
        exportWatermark: { type: boolean }
    Plan:
      type: object
      required: [id, name, entitlements]
      properties:
        id: { type: string }
        name: { type: string }
        entitlements: { $ref: "#/components/schemas/Entitlements" }
    EntitlementsResponse:
      type: object
      required: [planId, limits, usage]
      properties:
        planId: { type: string }
        limits: { $ref: "#/components/schemas/Entitlements" }
        usage:
          type: object
          properties:
            seats: { type: integer }
            activeProjects: { type: integer }
            processingMinutesThisMonth: { type: number }
    UsageResponse:
      type: object
      required: [month, processingMinutes, byProject, byKind]
      properties:
        month: { type: string }
        processingMinutes: { type: number }
        byProject:
          type: array
          items:
            type: object
            properties:
              projectId: { type: string, format: uuid }
              projectName: { type: string }
              minutes: { type: number }
        byKind:
          type: object
          additionalProperties: { type: number }
    Subscription:
      type: object
      required: [planId, status, provider]
      properties:
        planId: { type: string }
        status: { type: string, enum: [active, trialing, past_due, cancelled] }
        trialEndsAt: { type: [string, "null"], format: date-time }
        currentPeriodEnd: { type: [string, "null"], format: date-time }
        provider: { type: string, description: "manual, paddle, ..." }
        plans: { type: array, items: { $ref: "#/components/schemas/Plan" } }

    # ── projects ──
    ProjectRole: { type: string, enum: [lead, estimator, approver, viewer] }
    ProjectDefaults:
      type: object
      properties:
        ruleSetVersionId: { type: [string, "null"], format: uuid }
        classificationVersionIds: { type: array, items: { type: string, format: uuid } }
        dictionaryVersionIds: { type: array, items: { type: string, format: uuid } }
        federationVersionId: { type: [string, "null"], format: uuid }
    Project:
      type: object
      required: [id, orgId, name, currency, unitSystem, locale, status, defaults, permissions]
      properties:
        id: { type: string, format: uuid }
        orgId: { type: string, format: uuid }
        name: { type: string }
        code: { type: string }
        client: { type: string }
        location:
          type: object
          properties:
            address: { type: string }
            country: { type: string }
        currency: { type: string }
        unitSystem: { type: string, enum: [metric, imperial] }
        locale: { type: string }
        status: { type: string, enum: [active, archived] }
        sample: { type: boolean }
        defaults: { $ref: "#/components/schemas/ProjectDefaults" }
        projectDictionaryId: { type: string, format: uuid }
        myRole: { $ref: "#/components/schemas/ProjectRole" }
        permissions: { $ref: "#/components/schemas/Permissions" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ProjectListItem:
      allOf:
        - $ref: "#/components/schemas/Project"
        - type: object
          properties:
            counts:
              type: object
              properties:
                models: { type: integer }
                boqs: { type: integer }
                blockingQuestions: { type: integer }
                revisionsInReview: { type: integer }
                confirmedBoqs: { type: integer }
            lastActivityAt: { type: string, format: date-time }
    ProjectCreate:
      type: object
      required: [name]
      properties:
        name: { type: string }
        code: { type: string }
        client: { type: string }
        location:
          type: object
          properties:
            address: { type: string }
            country: { type: string }
        currency: { type: string }
        unitSystem: { type: string, enum: [metric, imperial] }
        locale: { type: string }
        defaults: { $ref: "#/components/schemas/ProjectDefaults" }
        sample: { type: string, enum: [duplex], description: Create the sample project instead (FL-1) }
    ProjectUpdate:
      type: object
      properties:
        name: { type: string }
        code: { type: string }
        client: { type: string }
        location:
          type: object
          properties:
            address: { type: string }
            country: { type: string }
        currency: { type: string }
        unitSystem: { type: string, enum: [metric, imperial] }
        locale: { type: string }
        defaults: { $ref: "#/components/schemas/ProjectDefaults" }
    ProjectMember:
      type: object
      required: [user, role]
      properties:
        user: { $ref: "#/components/schemas/User" }
        role: { $ref: "#/components/schemas/ProjectRole" }
        addedBy: { $ref: "#/components/schemas/UserRef" }
    AttentionItem:
      type: object
      required: [kind, projectId, projectName, title, url]
      properties:
        kind: { type: string, description: "Core kinds: review_requested, needs_input, new_model_version, job_failed, changes_requested; modules add theirs" }
        projectId: { type: string, format: uuid }
        projectName: { type: string }
        title: { type: string, description: i18n params are in `params`; title is a fallback }
        params: { type: object, additionalProperties: true }
        url: { type: string }
        at: { type: string, format: date-time }
    AuditEvent:
      type: object
      required: [id, action, entityType, entityId, at]
      properties:
        id: { type: string, format: uuid }
        actor: { $ref: "#/components/schemas/UserRef" }
        actorKind: { type: string, enum: [user, system, vendor, platform_admin] }
        action: { type: string }
        entityType: { type: string }
        entityId: { type: string }
        projectId: { type: [string, "null"], format: uuid }
        data: { type: object, additionalProperties: true }
        at: { type: string, format: date-time }
    AuditPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AuditEvent" } }
        nextCursor: { type: [string, "null"] }

    # ── models ──
    Model:
      type: object
      required: [id, projectId, name, discipline, archived]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        name: { type: string }
        discipline: { type: string }
        scope: { $ref: "../types/schema/run-request.schema.json#/definitions/ModelScope" }
        latestVersion: { $ref: "#/components/schemas/ModelVersion" }
        versionCount: { type: integer }
        archived: { type: boolean }
    ModelCreate:
      type: object
      required: [name]
      properties:
        name: { type: string }
        discipline: { type: string, description: "architecture, structure, mep, other federation keys, or 'detect'" }
        scope: { $ref: "../types/schema/run-request.schema.json#/definitions/ModelScope" }
    ModelUpdate:
      type: object
      properties:
        name: { type: string }
        discipline: { type: string }
        scope: { $ref: "../types/schema/run-request.schema.json#/definitions/ModelScope" }
    ModelVersionStatus: { type: string, enum: [awaiting_upload, queued, processing, ready, failed] }
    ModelVersion:
      type: object
      required: [id, modelId, number, fileName, sizeBytes, status, uploadedAt]
      properties:
        id: { type: string, format: uuid }
        modelId: { type: string, format: uuid }
        number: { type: integer }
        fileName: { type: string }
        sizeBytes: { type: integer }
        sha256: { type: string }
        status: { $ref: "#/components/schemas/ModelVersionStatus" }
        parseJobId: { type: [string, "null"], format: uuid }
        summary: { $ref: "#/components/schemas/ModelSummary" }
        identicalToVersion: { type: [integer, "null"] }
        error: { $ref: "#/components/schemas/Error" }
        note: { type: string }
        uploadedBy: { $ref: "#/components/schemas/UserRef" }
        uploadedAt: { type: string, format: date-time }
        usedBy:
          type: array
          items: { $ref: "#/components/schemas/RevisionRef" }
    ModelSummary:
      type: object
      description: Mirrors ModelSummary in packages/types/src/api.ts (minus modelId, cached)
      required: [ifcSchema, elementCount, byClass, checks]
      properties:
        ifcSchema: { type: string }
        authoringApp: { type: string }
        disciplineGuess: { type: string }
        storeys:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              elevation: { type: number }
        elementCount: { type: integer }
        openingCount: { type: integer }
        spaceCount: { type: integer }
        byClass: { type: object, additionalProperties: { type: integer } }
        checks: { type: object, description: "CheckCode → count", additionalProperties: { type: integer } }
        checkDetails:
          type: array
          items: { $ref: "../types/schema/parsed-model.schema.json#/definitions/Check" }
        parseMs: { type: integer }
    SceneIndex:
      type: object
      description: Mirrors SceneIndex in packages/types/src/api.ts
      required: [elements, spaces, openings]
      properties:
        elements:
          type: object
          additionalProperties:
            type: object
            required: [ifcClass]
            properties:
              ifcClass: { type: string }
              name: { type: string }
              type: { type: string }
              storey: { type: string }
              parent: { type: string }
              parts: { type: array, items: { type: string } }
        spaces: { type: array, items: { type: string } }
        openings: { type: array, items: { type: string } }
    NamesResponse:
      type: object
      required: [names]
      properties:
        names:
          type: array
          items:
            type: object
            description: Mirrors NameUse in packages/types/src/api.ts
            required: [field, raw, term, method, count, worthAsking]
            properties:
              field: { type: string }
              raw: { type: string }
              term: { type: [string, "null"] }
              method: { type: string }
              layer: { type: string, enum: [project, company, global, decision] }
              dictionary: { type: string }
              entryId: { type: string }
              count: { type: integer }
              classes: { type: array, items: { type: string } }
              worthAsking: { type: boolean }
              extracted: { type: object, additionalProperties: true }

    # ── library ──
    PresetKind: { type: string, enum: [rule_set, classification, dictionary, federation, resolution] }
    PresetLayer: { type: string, enum: [system, org, project] }
    Preset:
      type: object
      required: [id, kind, layer, slug, name, archived]
      properties:
        id: { type: string, format: uuid }
        orgId: { type: [string, "null"], format: uuid }
        projectId: { type: [string, "null"], format: uuid }
        kind: { $ref: "#/components/schemas/PresetKind" }
        layer: { $ref: "#/components/schemas/PresetLayer" }
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        basedOn: { type: string }
        starred: { type: boolean }
        available: { type: boolean, description: "false when a code list must be downloaded first (e.g. Uniclass)" }
        unavailableReason: { type: string }
        latestPublishedVersion: { $ref: "#/components/schemas/PresetVersionInfo" }
        draft: { $ref: "#/components/schemas/PresetVersionInfo" }
        usedByCount: { type: integer }
        archived: { type: boolean }
        permissions: { $ref: "#/components/schemas/Permissions" }
        updatedAt: { type: string, format: date-time }
        updatedBy: { $ref: "#/components/schemas/UserRef" }
    PresetCreate:
      type: object
      required: [kind, name, start]
      properties:
        kind: { $ref: "#/components/schemas/PresetKind" }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        basedOn: { type: string }
        projectId: { type: string, format: uuid, description: Create a project-layer preset }
        start:
          type: object
          required: [mode]
          properties:
            mode: { type: string, enum: [empty, copy, patch] }
            fromVersionId: { type: string, format: uuid }
    PresetVersionInfo:
      type: object
      required: [id, status]
      properties:
        id: { type: string, format: uuid }
        number: { type: [integer, "null"] }
        status: { type: string, enum: [draft, published] }
        changeNote: { type: string }
        problemCount: { type: integer }
        publishedBy: { $ref: "#/components/schemas/UserRef" }
        publishedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        etag: { type: string }
    PresetVersion:
      allOf:
        - $ref: "#/components/schemas/PresetVersionInfo"
        - type: object
          required: [presetId, doc, problems]
          properties:
            presetId: { type: string, format: uuid }
            doc: { description: "Engine document: RuleSet | RuleSetPatch | {codeList, map} | Dictionary | FederationSettings | ResolutionSettings" }
            extendsVersionId: { type: [string, "null"], format: uuid }
            problems: { type: array, items: { type: string } }
            flattened: { description: "For rule-set patches, the flattened RuleSet" }
    CheckResponse:
      type: object
      required: [ok, problems]
      properties:
        ok: { type: boolean }
        problems: { type: array, items: { type: string } }
        flattened: { description: Flattened RuleSet for rule sets }
    PresetUsage:
      type: object
      required: [projectId, projectName, boqId, boqName, revisionId, revisionLabel, revisionStatus, presetVersionNumber]
      properties:
        projectId: { type: string, format: uuid }
        projectName: { type: string }
        boqId: { type: string, format: uuid }
        boqName: { type: string }
        revisionId: { type: string, format: uuid }
        revisionLabel: { type: string }
        revisionStatus: { $ref: "#/components/schemas/RevisionStatus" }
        presetVersionNumber: { type: integer }
    TermInfo:
      type: object
      required: [id, label, category]
      properties:
        id: { type: string, description: "e.g. concrete.in_situ" }
        label: { type: string }
        category: { type: string }
        parent: { type: string }
        layer: { $ref: "#/components/schemas/PresetLayer" }
    TableReadResponse:
      type: object
      description: Mirrors TableReadResponse in packages/types/src/api.ts
      required: [sheets]
      properties:
        sheets:
          type: array
          items:
            type: object
            required: [name, rows, guess]
            properties:
              name: { type: string }
              rows: { type: array, items: { type: array, items: { type: string } } }
              guess: { type: object, additionalProperties: true }
    CodeListBuildRequest:
      type: object
      description: Mirrors CodeListBuildRequest in packages/types/src/api.ts
      required: [rows, headerRow, hierarchy]
      properties:
        rows: { type: array, items: { type: array, items: { type: string } } }
        headerRow: { type: integer }
        code: { type: integer }
        title: { type: integer }
        parent: { type: integer }
        description: { type: integer }
        level: { type: integer }
        hierarchy: { type: string, enum: [separator, parent, level, flat] }
        separator: { type: [string, "null"] }
    CodeListBuildResponse:
      type: object
      required: [codes, problems, stats]
      properties:
        codes: { type: array, items: { $ref: "../types/schema/codelist.schema.json#/definitions/Code" } }
        problems: { type: array, items: { type: string } }
        stats:
          type: object
          properties:
            codes: { type: integer }
            top: { type: integer }
            levels: { type: integer }
            skipped: { type: integer }
            duplicates: { type: integer }

    # ── decisions ──
    Decision:
      type: object
      required: [id, projectId, questionId, kind, answer, decidedAt]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        questionId: { type: string }
        kind: { type: string }
        answer: { type: [string, number, boolean, "null"] }
        note: { type: string }
        summary: { type: string, description: "Human summary of the question (raw name, element, line)" }
        decidedBy: { $ref: "#/components/schemas/UserRef" }
        decidedAt: { type: string, format: date-time }
        usedByLatestRuns: { type: boolean }
        promotedToPresetVersionId: { type: [string, "null"], format: uuid }
        answerType:
          $ref: "../types/schema/boq-result.schema.json#/definitions/AnswerType"
          description: The answer control of the question it answers, as last asked (S13 edits with it)
    DecisionInput:
      type: object
      required: [questionId, kind, answer]
      properties:
        questionId: { type: string }
        kind: { type: string }
        answer: { type: [string, number, boolean, "null"] }
        note: { type: string }

    # ── boqs ──
    RevisionStatus: { type: string, enum: [draft, in_review, approved, issued] }
    RevisionRef:
      type: object
      required: [boqId, boqName, revisionId, label, status]
      properties:
        boqId: { type: string, format: uuid }
        boqName: { type: string }
        revisionId: { type: string, format: uuid }
        label: { type: string }
        status: { $ref: "#/components/schemas/RevisionStatus" }
    RevisionModelInput:
      type: object
      required: [modelId, modelVersionId, discipline]
      properties:
        modelId: { type: string, format: uuid }
        modelVersionId: { type: string, format: uuid }
        discipline: { type: string }
        scope: { $ref: "../types/schema/run-request.schema.json#/definitions/ModelScope" }
        newerVersionAvailable: { type: [integer, "null"], description: Read-only hint }
    RevisionInputs:
      type: object
      required: [models, ruleSetVersionId, classificationVersionIds, dictionaryVersionIds]
      properties:
        models: { type: array, items: { $ref: "#/components/schemas/RevisionModelInput" } }
        ruleSetVersionId: { type: string, format: uuid }
        classificationVersionIds: { type: array, items: { type: string, format: uuid } }
        dictionaryVersionIds: { type: array, items: { type: string, format: uuid } }
        federationVersionId: { type: [string, "null"], format: uuid }
        resolutionVersionId: { type: [string, "null"], format: uuid }
    RevisionInputsPartial:
      type: object
      description: Any subset of RevisionInputs; missing fields keep their value (or project defaults on create)
      properties:
        models: { type: array, items: { $ref: "#/components/schemas/RevisionModelInput" } }
        ruleSetVersionId: { type: string, format: uuid }
        classificationVersionIds: { type: array, items: { type: string, format: uuid } }
        dictionaryVersionIds: { type: array, items: { type: string, format: uuid } }
        federationVersionId: { type: [string, "null"], format: uuid }
        resolutionVersionId: { type: [string, "null"], format: uuid }
    ReviewComment:
      type: object
      required: [id, by, at, text]
      properties:
        id: { type: string, format: uuid }
        by: { $ref: "#/components/schemas/UserRef" }
        at: { type: string, format: date-time }
        text: { type: string }
        lineKey: { type: string }
        outcome: { type: string, enum: [approved, changes_requested] }
    BoqRevision:
      type: object
      required: [id, boqId, number, label, status, inputs, pendingChanges, permissions]
      properties:
        id: { type: string, format: uuid }
        boqId: { type: string, format: uuid }
        number: { type: integer }
        label: { type: string }
        status: { $ref: "#/components/schemas/RevisionStatus" }
        inputs: { $ref: "#/components/schemas/RevisionInputs" }
        currentRun: { $ref: "#/components/schemas/Run" }
        basedOnRevisionId: { type: [string, "null"], format: uuid }
        basedOnRunId: { type: [string, "null"], format: uuid, description: The frozen run of the based-on revision }
        pendingChanges: { type: array, items: { type: string } }
        reviewers: { type: array, items: { $ref: "#/components/schemas/UserRef" } }
        reviewComments: { type: array, items: { $ref: "#/components/schemas/ReviewComment" } }
        submittedBy: { $ref: "#/components/schemas/UserRef" }
        submittedAt: { type: string, format: date-time }
        approvedBy: { $ref: "#/components/schemas/UserRef" }
        approvedAt: { type: string, format: date-time }
        issuedBy: { $ref: "#/components/schemas/UserRef" }
        issuedAt: { type: string, format: date-time }
        issueNote: { type: string }
        openQuestionsAtSave: { type: [integer, "null"] }
        frozen:
          type: object
          properties:
            runId: { type: string, format: uuid }
            exportIds: { type: array, items: { type: string, format: uuid } }
        permissions: { $ref: "#/components/schemas/Permissions" }
    Boq:
      type: object
      required: [id, projectId, name, currentRevision, archived]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        status: { type: string, enum: [working, confirmed], description: P29 }
        confirmedBy: { $ref: "#/components/schemas/UserRef" }
        confirmedAt: { type: [string, "null"], format: date-time }
        currentRevision: { $ref: "#/components/schemas/BoqRevision" }
        latestIssuedRevisionId: { type: [string, "null"], format: uuid }
        newModelVersionsAvailable: { type: boolean }
        archived: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    # ── adjustments ──
    LineOverrideInput:
      type: object
      description: "A line edit (F06 §6, P20). Omitted fields are not edited. `unit` needs `quantity` (409 unit_needs_quantity); `quantity` and `excluded` need a reason."
      required: [lineKey]
      properties:
        lineKey: { type: string }
        quantity: { type: [number, "null"], description: null = force flagged }
        description: { type: string }
        unit: { type: string }
        codes: { type: object, additionalProperties: { type: string }, description: "classification id → code: moves the line to that section" }
        sortAfter: { type: [string, "null"], description: line key it follows within its section; null = first }
        excluded: { type: boolean }
        reason: { type: string }
    LineOverride:
      type: object
      required: [id, boqId, lineKey, createdAt]
      properties:
        id: { type: string, format: uuid }
        boqId: { type: string, format: uuid }
        lineKey: { type: string }
        quantity: { type: [number, "null"] }
        description: { type: string }
        unit: { type: string }
        codes: { type: object, additionalProperties: { type: string } }
        sortAfter: { type: [string, "null"] }
        excluded: { type: boolean }
        reason: { type: string }
        createdBy: { $ref: "#/components/schemas/UserRef" }
        createdAt: { type: string, format: date-time }
    ManualItemInput:
      type: object
      required: [item]
      properties:
        item: { $ref: "../types/schema/rule-set.schema.json#/definitions/ManualItem" }
        codes:
          type: object
          description: "classification id → code, for the line's codes"
          additionalProperties: { type: string }
        sortHint: { type: string }
    ManualItemRecord:
      allOf:
        - $ref: "#/components/schemas/ManualItemInput"
        - type: object
          required: [id, boqId, createdAt]
          properties:
            id: { type: string, format: uuid }
            boqId: { type: string, format: uuid }
            createdBy: { $ref: "#/components/schemas/UserRef" }
            createdAt: { type: string, format: date-time }

    # ── runs ──
    RunStatus: { type: string, enum: [queued, running, complete, needs_input, failed, cancelled] }
    Run:
      type: object
      required: [id, revisionId, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        revisionId: { type: string, format: uuid }
        jobId: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/RunStatus" }
        stats:
          type: object
          description: BoqResult.stats plus question and warning counts
          properties:
            elements: { type: integer }
            measuredElements: { type: integer }
            excludedElements: { type: integer }
            unmatchedElements: { type: integer }
            lines: { type: integer }
            flaggedLines: { type: integer }
            decisionsApplied: { type: integer }
            durationMs: { type: integer }
            questions: { type: integer }
            blockingQuestions: { type: integer }
            warnings: { type: integer }
        models: { type: array, items: { $ref: "../types/schema/boq-result.schema.json#/definitions/ModelReport" } }
        building: { $ref: "../types/schema/boq-result.schema.json#/definitions/BuildingMeasures" }
        snapshotVersions:
          type: object
          description: Which preset versions the run used
          properties:
            ruleSetVersionId: { type: string, format: uuid }
            classificationVersionIds: { type: array, items: { type: string, format: uuid } }
            dictionaryVersionIds: { type: array, items: { type: string, format: uuid } }
            models:
              type: array
              description: The model versions the run used, in input order (F07 §2 loads each into the viewer)
              items:
                type: object
                required: [modelId, modelVersionId, discipline]
                properties:
                  modelId: { type: string, format: uuid }
                  modelVersionId: { type: string, format: uuid }
                  discipline: { type: string }
                  traceId: { type: string, description: "The id the run's results use for this model: ModelReport.id and the lines' trace.elements[].model" }
        classifications:
          type: array
          description: Attached code systems, in order (first = default grouping)
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: string }
              name: { type: string }
        engineVersion: { type: string }
        error: { $ref: "#/components/schemas/Error" }
        createdBy: { $ref: "#/components/schemas/UserRef" }
        createdAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
    RunLine:
      type: object
      description: >-
        An engine BoqLine (boq-result.schema.json, BoqLine) plus its place in the run. Its fields are
        listed one by one because the generated BoqLine schema allows no other properties, so an
        allOf with it could never validate (FE-009).
      required: [key, ruleId, ruleKind, description, unit, quantity, source, keys, trace, codes, tags, notes, sortIndex]
      properties:
        key: { $ref: "../types/schema/boq-result.schema.json#/definitions/BoqLine/properties/key" }
        ruleId: { $ref: "../types/schema/boq-result.schema.json#/definitions/BoqLine/properties/ruleId" }
        ruleKind: { $ref: "../types/schema/boq-result.schema.json#/definitions/BoqLine/properties/ruleKind" }
        description: { $ref: "../types/schema/boq-result.schema.json#/definitions/BoqLine/properties/description" }
        unit: { $ref: "../types/schema/boq-result.schema.json#/definitions/BoqLine/properties/unit" }
        quantity: { $ref: "../types/schema/boq-result.schema.json#/definitions/BoqLine/properties/quantity" }
        source: { $ref: "../types/schema/boq-result.schema.json#/definitions/BoqLine/properties/source" }
        family: { $ref: "../types/schema/boq-result.schema.json#/definitions/BoqLine/properties/family" }
        keys: { $ref: "../types/schema/boq-result.schema.json#/definitions/BoqLine/properties/keys" }
        trace: { $ref: "../types/schema/boq-result.schema.json#/definitions/BoqLine/properties/trace" }
        codes: { $ref: "../types/schema/boq-result.schema.json#/definitions/BoqLine/properties/codes" }
        location: { $ref: "../types/schema/boq-result.schema.json#/definitions/BoqLine/properties/location" }
        tags: { $ref: "../types/schema/boq-result.schema.json#/definitions/BoqLine/properties/tags" }
        notes: { $ref: "../types/schema/boq-result.schema.json#/definitions/BoqLine/properties/notes" }
        sortIndex: { type: integer }
        positionNo: { type: string, description: "Position number in its section, e.g. 5.3 (P30); frozen in saved versions" }
        overridden:
          type: object
          description: >-
            The line's edits as the run applied them (F06 §6, EN-003 extended): which fields were edited,
            with the engine's values, so the sheet can mark them and show what the engine said.
          required: [fields]
          properties:
            fields: { type: array, items: { type: string, enum: [quantity, description, unit, codes, excluded, order] } }
            engineQuantity: { type: [number, "null"] }
            quantity: { type: [number, "null"] }
            engineDescription: { type: string }
            engineUnit: { type: string }
            engineCodes: { type: object, additionalProperties: { type: [string, "null"] }, description: "classification id → the engine's code (null: none)" }
            reason: { type: string }
        excluded: { type: boolean, description: "Excluded by a line edit: out of totals and the exports' BoQ sheet, still listed (BR-03, BR-09)" }
    LineGroup:
      type: object
      required: [path, title, lineCount]
      properties:
        path: { type: string, description: "code path joined by '/'" }
        code: { type: string }
        title: { type: string }
        lineCount: { type: integer }
        unit: { type: [string, "null"], description: Set when all lines share one unit }
        quantity: { type: [number, "null"], description: Sum when unit is set }
    LinesPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/RunLine" } }
        groups: { type: array, items: { $ref: "#/components/schemas/LineGroup" } }
        total: { type: integer }
        nextCursor: { type: [string, "null"] }
    LineDetail:
      allOf:
        - $ref: "#/components/schemas/RunLine"
        - type: object
          properties:
            readableFormula: { type: string }
            log: { type: array, items: { $ref: "../types/schema/boq-result.schema.json#/definitions/LogEntry" } }
            reviewComments: { type: array, items: { $ref: "#/components/schemas/ReviewComment" } }
    QuestionWithDecision:
      type: object
      description: >-
        An engine Question (boq-result.schema.json, Question) joined with the project's decision for it.
        Its fields are listed one by one because the generated Question schema allows no other
        properties, so an allOf with it could never validate (FE-010, like RunLine).
      required: [id, kind, blocking, message, answer, answeredAfterRun]
      properties:
        id: { $ref: "../types/schema/boq-result.schema.json#/definitions/Question/properties/id" }
        kind: { $ref: "../types/schema/boq-result.schema.json#/definitions/Question/properties/kind" }
        blocking: { $ref: "../types/schema/boq-result.schema.json#/definitions/Question/properties/blocking" }
        message: { $ref: "../types/schema/boq-result.schema.json#/definitions/Question/properties/message" }
        answer: { $ref: "../types/schema/boq-result.schema.json#/definitions/Question/properties/answer" }
        guids: { $ref: "../types/schema/boq-result.schema.json#/definitions/Question/properties/guids" }
        field: { $ref: "../types/schema/boq-result.schema.json#/definitions/Question/properties/field" }
        raw: { $ref: "../types/schema/boq-result.schema.json#/definitions/Question/properties/raw" }
        occurrences: { $ref: "../types/schema/boq-result.schema.json#/definitions/Question/properties/occurrences" }
        suggestion: { $ref: "../types/schema/boq-result.schema.json#/definitions/Question/properties/suggestion" }
        decision: { $ref: "#/components/schemas/Decision" }
        answeredAfterRun:
          type: boolean
          description: >-
            The project's answer differs from the one this run was generated with (answered, changed or
            cleared after the run): it applies on the next run (F05 §1, §3).
    LogPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "../types/schema/boq-result.schema.json#/definitions/LogEntry" } }
        nextCursor: { type: [string, "null"] }
    ElementLines:
      type: object
      required: [guid, lines]
      properties:
        guid: { type: string }
        modelVersionId: { type: string, format: uuid }
        ifcClass: { type: string }
        name: { type: string }
        type: { type: string }
        storey: { type: string }
        properties: { type: object, additionalProperties: true }
        status: { type: string, enum: [measured, excluded, unmatched, covered_by_parent] }
        lines:
          type: array
          items:
            type: object
            required: [lineKey, description, unit, quantity]
            properties:
              lineKey: { type: string }
              description: { type: string }
              unit: { type: string }
              quantity: { type: [number, "null"], description: This element's share }
    Coverage:
      type: object
      description: Compact per-element status for viewer colouring
      required: [measured, excluded, unmatched, coveredByParent]
      properties:
        measured: { type: array, items: { type: string } }
        excluded: { type: array, items: { type: string } }
        unmatched: { type: array, items: { type: string } }
        coveredByParent: { type: array, items: { type: string } }

    # ── diffs ──
    DiffSummary:
      type: object
      properties:
        linesAdded: { type: integer }
        linesRemoved: { type: integer }
        linesChanged: { type: integer }
        linesUnchanged: { type: integer }
        elementsAdded: { type: integer }
        elementsRemoved: { type: integer }
        elementsChanged: { type: integer }
        questionsNew: { type: integer }
        questionsResolved: { type: integer }
        guidChurnWarning: { type: boolean, description: "More than half of a model's elements changed GlobalId (F08 edge cases)" }
        inputsChanged: { type: array, items: { type: string }, description: "What differs between the two runs' requests, as BoqRevision.pendingChanges names it" }
        byModel:
          type: array
          description: Elements added, removed and changed per model (F08 §4); only models with changes
          items:
            type: object
            required: [model, added, removed, changed]
            properties:
              model: { type: string, description: The model's name }
              added: { type: integer }
              removed: { type: integer }
              changed: { type: integer }
    LineChange:
      type: object
      required: [lineKey, change]
      properties:
        lineKey: { type: string }
        change: { type: string, enum: [added, removed, changed] }
        before:
          type: object
          properties:
            quantity: { type: [number, "null"] }
            unit: { type: string }
            description: { type: string }
            codes: { type: object, additionalProperties: true }
        after:
          type: object
          properties:
            quantity: { type: [number, "null"] }
            unit: { type: string }
            description: { type: string }
            codes: { type: object, additionalProperties: true }
        delta: { type: [number, "null"] }
        deltaPct: { type: [number, "null"] }
        causes:
          type: array
          items: { type: string, enum: [elements_added, elements_removed, elements_changed, rules_changed, decision_changed, override_changed] }
    ElementChange:
      type: object
      required: [guid, change]
      properties:
        guid: { type: string }
        model: { type: string }
        change: { type: string, enum: [added, removed, changed] }
        fields: { type: array, items: { type: string } }
        lineKeys: { type: array, items: { type: string } }
    RunDiff:
      type: object
      required: [id, fromRunId, toRunId, summary]
      properties:
        id: { type: string, format: uuid }
        fromRunId: { type: string, format: uuid }
        toRunId: { type: string, format: uuid }
        summary: { $ref: "#/components/schemas/DiffSummary" }
        questions:
          type: object
          properties:
            new: { type: array, items: { type: string } }
            resolved: { type: array, items: { type: string } }

    # ── exports, jobs, notifications ──
    Export:
      type: object
      required: [id, kind, fileName, createdAt]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, description: "Core kinds: boq_xlsx, issued_boq_xlsx, changes_xlsx, preset_template_xlsx; modules add their own (e.g. pricing.estimate_xlsx)" }
        subjectType: { type: string }
        subjectId: { type: string }
        fileName: { type: string }
        sizeBytes: { type: integer }
        jobId: { type: string, format: uuid }
        createdBy: { $ref: "#/components/schemas/UserRef" }
        createdAt: { type: string, format: date-time }
    JobType: { type: string, description: "Core types: parse, run, preview, diff, export_xlsx, import_boq_edits, names; modules add pricing.* and the like" }
    JobStatus: { type: string, enum: [queued, running, succeeded, failed, cancelled] }
    PreviewLine:
      type: object
      required: [key, ruleId, description, quantity, unit]
      properties:
        key: { type: string }
        ruleId: { type: string, description: The BoQ item (rule) the line comes from }
        description: { type: string }
        quantity: { type: [number, "null"] }
        unit: { type: string }
        storey: { type: string }
        keys: { type: object, additionalProperties: true, description: "The values that split the line (`BoqLine.keys`), e.g. for an item text's sample" }
    PreviewResult:
      type: object
      description: >-
        What a `preview` job's `output.previewResultUrl` (a signed GET URL, 7 days) returns (F10 §6): the
        lines of the previewed document and, when compared, what changed against the latest published
        version, by line key. The job's output also carries `presetVersionId` (what was previewed),
        `lines` (count) and `compare` (the counts).
      required: [lines, questions, blockingQuestions, warnings, compare, changes]
      properties:
        lines: { type: array, items: { $ref: "#/components/schemas/PreviewLine" } }
        questions: { type: integer }
        blockingQuestions: { type: integer }
        warnings: { type: integer }
        compare:
          type: [object, "null"]
          required: [versionId, versionNumber, added, removed, changed]
          properties:
            versionId: { type: string, format: uuid }
            versionNumber: { type: integer }
            presetName: { type: string, description: "Set when the comparison is another preset's version: the one a patch with nothing published is based on" }
            added: { type: integer }
            removed: { type: integer }
            changed: { type: integer }
        changes:
          type: array
          items:
            type: object
            required: [key, change]
            properties:
              key: { type: string }
              change: { type: string, enum: [added, removed, changed] }
              before: { $ref: "#/components/schemas/PreviewLine" }
              after: { $ref: "#/components/schemas/PreviewLine" }
    Job:
      type: object
      required: [id, type, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/JobType" }
        status: { $ref: "#/components/schemas/JobStatus" }
        progress:
          type: object
          properties:
            stage: { type: string }
            pct: { type: number }
            message: { type: string }
        subjectType: { type: string }
        subjectId: { type: string }
        output:
          type: object
          description: "Public part of the output: e.g. {exportId}, {diffId}, {previewResultUrl}, {importReport}"
          additionalProperties: true
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            retryable: { type: boolean }
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
    Notification:
      type: object
      required: [id, kind, params, url, createdAt]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string }
        params: { type: object, additionalProperties: true }
        orgId: { type: [string, "null"], format: uuid }
        entityType: { type: string }
        entityId: { type: string }
        url: { type: string }
        readAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
