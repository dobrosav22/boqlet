# Lint configuration for openapi.yaml: `npx @redocly/cli lint plan/05-api/openapi.yaml --config plan/05-api/redocly.yaml`
extends:
  - recommended
rules:
  operation-summary: off          # operationId + description are enough; summaries added where useful
  operation-4xx-response: off     # 401/404 are documented once in conventions.md and apply to every call
  operation-2xx-response: off     # redirect-only endpoints (signed downloads) answer 302
  tag-description: off
  info-license: off               # private API
